<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Joshva Jashper W — Aspiring QA Automation Engineer</title>
  <desc id="desc">An animated dark technology banner with flowing cyan and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#101022"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#47e6d0"/>
      <stop offset="0.5" stop-color="#6e8bff"/>
      <stop offset="1" stop-color="#d66cff"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9bb5ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#55e3d0" stop-opacity=".32"/>
      <stop offset="1" stop-color="#55e3d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="62" r="215" fill="url(#orb)">
    <animate attributeName="cx" values="1020;950;1020" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="62;120;62" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="300" r="180" fill="#745cff" opacity=".08">
    <animate attributeName="r" values="160;205;160" dur="7s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 250 C220 190 300 310 520 245 S850 180 1200 238" fill="none" stroke="url(#glow)" stroke-width="2" stroke-opacity=".45"/>
  <path d="M0 258 C220 198 300 318 520 253 S850 188 1200 246" fill="none" stroke="url(#glow)" stroke-width="7" stroke-opacity=".15" filter="url(#softGlow)"/>
  <g fill="#d8e5ff" opacity=".8">
    <circle cx="140" cy="84" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="210" r="2"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="92" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="260" r="1.5"><animate attributeName="opacity" values=".9;.2;.9" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="119" fill="#9fb0d0" font-size="17" font-weight="600" letter-spacing="5">BUILDING CONFIDENCE THROUGH TESTING</text>
    <text x="600" y="184" fill="#f3f6ff" font-size="48" font-weight="800" letter-spacing="1">JOSHVA JASHPER W</text>
    <text x="600" y="224" fill="url(#glow)" font-size="22" font-weight="700" letter-spacing="3">ASPIRING QA AUTOMATION ENGINEER</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="url(#glow)" stroke-opacity=".55" stroke-width="2"/>
</svg>
